name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: true
      ENV_NAME: ci
      BASE_URL: ${{ secrets.BASE_URL || 'https://qaplayground.com/bank/' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://restful-booker.herokuapp.com/' }}
      API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
      API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}
      STANDARD_USER: ${{ secrets.STANDARD_USER || 'standard_user' }}
      STANDARD_PASS: ${{ secrets.STANDARD_PASS || 'bank_sauce' }}
      ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin_user' }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'admin_sauce' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Static quality gates
        run: npm run check

      - name: Run Playwright tests
        run: npm test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
