name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create env file
        run: |
          echo "BASE_URL=https://qaplayground.com/bank" >> .env.qa
          echo "STANDARD_USER=standard_user" >> .env.qa
          echo "STANDARD_PASS=bank_sauce" >> .env.qa
          echo "ADMIN_USER=admin_user" >> .env.qa
          echo "ADMIN_PASS=admin_sauce" >> .env.qa
          echo "ENV_NAME=ci" >> .env.qa

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30