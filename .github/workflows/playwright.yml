name: Quality and Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ENV_NAME: ci
  BASE_URL: ${{ secrets.BASE_URL || 'https://qaplayground.com/bank/' }}
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://restful-booker.herokuapp.com/' }}
  API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
  API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}
  STANDARD_USER: ${{ secrets.STANDARD_USER || 'standard_user' }}
  STANDARD_PASS: ${{ secrets.STANDARD_PASS || 'bank_sauce' }}
  ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin_user' }}
  ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'admin_sauce' }}

jobs:
  quality:
    name: TypeScript, lint, and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  ui:
    name: UI — ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install setup and test browsers
        # The shared setup project authenticates in Chromium before either browser project runs.
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Run authenticated and anonymous browser projects
        run: npx playwright test --project=${{ matrix.browser }} --project=login-${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    name: API contract and lifecycle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-api-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
