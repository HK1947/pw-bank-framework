name: Quality and Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ENV_NAME: ci
  BASE_URL: https://qaplayground.com/bank/
  API_BASE_URL: https://restful-booker.herokuapp.com
  STANDARD_USER: standard_user
  STANDARD_PASS: ${{ secrets.STANDARD_PASS || 'bank_sauce' }}
  ADMIN_USER: admin_user
  ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'admin_sauce' }}
  API_USERNAME: admin
  API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}

jobs:
  quality:
    name: TypeScript, lint, and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate

  ui:
    name: UI — ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    name: API contract and lifecycle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
